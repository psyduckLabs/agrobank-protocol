name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: agrobank
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build de la web
        working-directory: apps/web
        run: cp .env.example .env.local && pnpm build
      - name: Migraciones de Supabase sobre Postgres
        run: |
          for f in supabase/local-test/auth_stub.sql supabase/migrations/*.sql; do
            PGPASSWORD=agrobank psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f "$f"
          done
      - name: Indexador contra Testnet + reconciliación
        working-directory: apps/web
        env:
          DATABASE_URL: postgres://postgres:agrobank@localhost:5432/postgres
        run: |
          set -a; . ./.env.local; set +a
          node scripts/indexer.ts
          node scripts/indexer.ts --reconcile-out reconciliation.json
